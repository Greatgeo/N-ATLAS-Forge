    <script>
      (function() {
        function isExtensionError(msg, src, stack) {
          var str = String(msg || '') + ' ' + String(src || '') + ' ' + String(stack || '');
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 str.indexOf('MetaMask') !== -1 ||
                 str.toLowerCase().indexOf('failed to connect to metamask') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename, e.error && e.error.stack)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          if (isExtensionError(r && r.message, '', r && r.stack)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
